<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <title>meetmid_flutter</title>
  <link rel="manifest" href="manifest.json">
  <!-- Kakao SDK가 추가하는 스크립트의 HTTP URL을 HTTPS로 업그레이드 (t1.daumcdn.net은 HTTP 거부) -->
  <script>
    (function () {
      // MutationObserver: DOM에 추가되는 script 노드의 src를 HTTPS로 교체
      var _observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.tagName === 'SCRIPT') {
              var s = node.getAttribute('src');
              if (s && s.startsWith('http://t1.daumcdn.net')) {
                var upgraded = s.replace('http://', 'https://');
                console.log('[KakaoMap] HTTPS 업그레이드 (MutationObserver):', upgraded);
                node.setAttribute('src', upgraded);
              }
            }
          });
        });
      });
      _observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <!-- 카카오맵 JavaScript SDK: autoload=false로 kakao 객체를 동기적으로 정의 -->
  <script type="text/javascript"
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=04a8f8db7bad0830a64e1ec052d0bfa7&autoload=false">
    </script>
  <script>
    window._kakaoMap = null;
    window._kakaoMapReady = false;
    window._kakaoMapCancelled = false;
    window._kakaoMapsModuleReady = false;
    window._kakaoMapPendingCreate = null;

    console.log('[KakaoMap] kakao 객체:', typeof kakao);

    // SDK가 동기 로드되면 즉시 maps 모듈 초기화, 아직 undefined면 100ms 간격으로 재시도
    function _tryInitKakaoMaps() {
      if (typeof kakao === 'undefined') {
        console.log('[KakaoMap] kakao 아직 undefined, 재시도 중...');
        setTimeout(_tryInitKakaoMaps, 100);
        return;
      }
      console.log('[KakaoMap] kakao 객체 확인됨, maps 모듈 로드 시작');
      kakao.maps.load(function () {
        window._kakaoMapsModuleReady = true;
        console.log('[KakaoMap] kakao.maps 모듈 로드 완료');
        if (window._kakaoMapPendingCreate) {
          window._kakaoMapPendingCreate();
          window._kakaoMapPendingCreate = null;
        }
      });
    }
    _tryInitKakaoMaps();

    function flutterCreateKakaoMapInBody(lat, lng) {
      window._kakaoMapCancelled = false;
      window._kakaoMapPendingCreate = null;

      var existing = document.getElementById('_flutter_kakao_map');
      if (existing) existing.remove();

      var div = document.createElement('div');
      div.id = '_flutter_kakao_map';
      div.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;';
      document.body.insertBefore(div, document.body.firstChild);

      window._kakaoMapReady = false;
      window._kakaoMapCancelled = false;
      console.log('[KakaoMap] 지도 div 생성됨, maps 모듈 준비:', window._kakaoMapsModuleReady);

      function createMap() {
        if (window._kakaoMapCancelled) return;
        try {
          window._kakaoMap = new kakao.maps.Map(div, {
            center: new kakao.maps.LatLng(lat || 37.5665, lng || 126.9780),
            level: 5
          });
          window._kakaoMapReady = true;
          console.log('[KakaoMap] 지도 생성 성공');
          setTimeout(function () {
            if (window._kakaoMap) window._kakaoMap.relayout();
          }, 300);
        } catch (e) {
          console.error('[KakaoMap] 초기화 실패:', e);
        }
      }

      if (window._kakaoMapsModuleReady) {
        createMap();
      } else {
        console.log('[KakaoMap] maps 모듈 로드 대기 중...');
        window._kakaoMapPendingCreate = createMap;
      }
    }

    // ── Polyline ────────────────────────────────────────────────────
    window._kakaoPolylines = [];

    function flutterClearPolylines() {
      (window._kakaoPolylines || []).forEach(function (p) { p.setMap(null); });
      window._kakaoPolylines = [];
    }

    // data: [{name, coords:[[lng,lat],...], color}]
    function flutterDrawPolylines(json) {
      flutterClearPolylines();
      if (!window._kakaoMap) return;
      var data = JSON.parse(json);
      data.forEach(function (item) {
        var coords = item.coords || [];
        if (coords.length < 2) return;
        var path = coords.map(function (c) {
          return new kakao.maps.LatLng(c[1], c[0]); // [lng,lat] → LatLng(lat,lng)
        });
        var polyline = new kakao.maps.Polyline({
          path: path,
          strokeWeight: 4,
          strokeColor: item.color || '#4CAF50',
          strokeOpacity: 0.85,
          strokeStyle: 'solid',
        });
        polyline.setMap(window._kakaoMap);
        window._kakaoPolylines.push(polyline);
      });
      console.log('[KakaoMap] polyline', data.length, '개 그림');
    }

    function flutterDestroyKakaoMap() {
      flutterClearPolylines();
      window._kakaoMapCancelled = true;
      window._kakaoMapPendingCreate = null;
      var div = document.getElementById('_flutter_kakao_map');
      if (div) div.remove();
      window._kakaoMap = null;
      window._kakaoMapReady = false;
      console.log('[KakaoMap] 지도 제거됨');
    }

    function flutterMoveMap(lat, lng, level) {
      if (!window._kakaoMap) return;
      window._kakaoMap.setCenter(new kakao.maps.LatLng(lat, lng));
      if (level) window._kakaoMap.setLevel(level);
    }

    function flutterAddMarker(lat, lng, label) {
      if (!window._kakaoMap) return;
      var pos = new kakao.maps.LatLng(lat, lng);
      var marker = new kakao.maps.Marker({ position: pos, map: window._kakaoMap });
      if (label) {
        var info = new kakao.maps.InfoWindow({
          content: '<div style="padding:5px 8px;font-size:12px;white-space:nowrap;color:#333;">' + label + '</div>'
        });
        info.open(window._kakaoMap, marker);
      }
      if (!window._kakaoMarkers) window._kakaoMarkers = [];
      window._kakaoMarkers.push(marker);
    }

    function flutterClearMarkers() {
      (window._kakaoMarkers || []).forEach(function (m) { m.setMap(null); });
      window._kakaoMarkers = [];
    }

    window._midpointInfoVisible = false;
    window._midpointOverlay = null;
    window._midpointInfoOverlay = null;

    function flutterAddMidpointMarker(lat, lng, address) {
      if (!window._kakaoMap) return;
      var pos = new kakao.maps.LatLng(lat, lng);
      var safeAddr = (address || '중간 지점').replace(/</g, '&lt;');

      var flagContent =
        '<div style="cursor:pointer;display:flex;flex-direction:column;align-items:center;" onclick="window._toggleMidInfo()">' +
        '<svg width="48" height="58" viewBox="0 0 36 44" xmlns="http://www.w3.org/2000/svg">' +
        '<rect x="7" y="4" width="4" height="36" rx="2" fill="#555"/>' +
        '<path d="M11 4 L32 12 L11 20 Z" fill="#EB3B5A"/>' +
        '</svg>' +
        '</div>';

      window._midpointOverlay = new kakao.maps.CustomOverlay({
        position: pos, content: flagContent,
        yAnchor: 1, xAnchor: 0.5, map: window._kakaoMap, zIndex: 100
      });

      var infoContent =
        '<div style="background:white;padding:6px 12px;border-radius:14px;' +
        'box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:12px;font-weight:700;' +
        'color:#222;white-space:nowrap;border:2px solid #FF5252;margin-bottom:4px;">' +
        '📍 ' + safeAddr +
        '</div>';

      window._midpointInfoOverlay = new kakao.maps.CustomOverlay({
        position: pos, content: infoContent,
        yAnchor: 2.2, xAnchor: 0.5, map: null, zIndex: 101
      });

      window._toggleMidInfo = function () {
        window._midpointInfoVisible = !window._midpointInfoVisible;
        window._midpointInfoOverlay.setMap(
          window._midpointInfoVisible ? window._kakaoMap : null
        );
      };

      if (!window._kakaoMarkers) window._kakaoMarkers = [];
      window._kakaoMarkers.push(window._midpointOverlay);
    }

    function flutterMoveMidpointMarker(lat, lng, name) {
      if (!window._kakaoMap) return;
      // 기존 핀 제거
      if (window._destinationOverlay) {
        window._destinationOverlay.setMap(null);
        window._destinationOverlay = null;
      }
      var pos = new kakao.maps.LatLng(lat, lng);
      if (window._midpointOverlay) window._midpointOverlay.setPosition(pos);
      if (window._midpointInfoOverlay) {
        window._midpointInfoOverlay.setPosition(pos);
        var safeAddr = (name || '목적지').replace(/</g, '&lt;');
        window._midpointInfoOverlay.setContent(
          '<div style="background:white;padding:6px 12px;border-radius:14px;' +
          'box-shadow:0 2px 8px rgba(0,0,0,0.25);font-size:12px;font-weight:700;' +
          'color:#222;white-space:nowrap;border:2px solid #FF5252;margin-bottom:4px;">' +
          '📍 ' + safeAddr + '</div>'
        );
      }
    }

    window._destinationOverlay = null;
    function flutterAddDestinationMarker(lat, lng, name) {
      if (!window._kakaoMap) return;
      if (window._destinationOverlay) {
        window._destinationOverlay.setMap(null);
        window._destinationOverlay = null;
      }
      var pos = new kakao.maps.LatLng(lat, lng);
      var safeName = (name || '목적지').replace(/</g, '&lt;');
      var content =
        '<div style="display:flex;flex-direction:column;align-items:center;">' +
        '<div style="background:#EB3B5A;padding:4px 12px;border-radius:14px;font-size:12px;font-weight:700;' +
        'color:white;white-space:nowrap;box-shadow:0 2px 8px rgba(235,59,90,0.5);">📍 ' + safeName + '</div>' +
        '<svg width="12" height="8" viewBox="0 0 12 8" xmlns="http://www.w3.org/2000/svg">' +
        '<path d="M6 8 L0 0 L12 0 Z" fill="#EB3B5A"/>' +
        '</svg>' +
        '</div>';
      window._destinationOverlay = new kakao.maps.CustomOverlay({
        position: pos, content: content,
        yAnchor: 1.3, xAnchor: 0.5, map: window._kakaoMap, zIndex: 150
      });
      if (!window._kakaoMarkers) window._kakaoMarkers = [];
      window._kakaoMarkers.push(window._destinationOverlay);
    }

    function flutterAddCircleMarker(lat, lng, label, colorHex) {
      if (!window._kakaoMap) return;
      var pos = new kakao.maps.LatLng(lat, lng);
      var color = colorHex || '#4B6584';
      var content =
        '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">' +
        '<div style="background:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;' +
        'color:#2d3436;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.25);">' + label + '</div>' +
        '<svg width="30" height="44" viewBox="0 0 30 44" xmlns="http://www.w3.org/2000/svg">' +
        '<circle cx="15" cy="19" r="10" fill="#2980B9"/>' +
        '<rect x="13" y="24" width="4" height="16" rx="2" fill="#555"/>' +
        '</svg>' +
        '</div>';
      var overlay = new kakao.maps.CustomOverlay({
        position: pos, content: content,
        yAnchor: 1, xAnchor: 0.5, map: window._kakaoMap
      });
      if (!window._kakaoMarkers) window._kakaoMarkers = [];
      window._kakaoMarkers.push(overlay);
    }

    function flutterFitBounds() {
      if (!window._kakaoMap || !window._kakaoMarkers || !window._kakaoMarkers.length) return;
      var sw = null, ne = null;
      window._kakaoMarkers.forEach(function (m) {
        var pos = null;
        try { pos = m.getPosition(); } catch (e) { }
        if (!pos) return;
        var lat = pos.getLat(), lng = pos.getLng();
        if (sw === null) {
          sw = { lat: lat, lng: lng };
          ne = { lat: lat, lng: lng };
        } else {
          sw.lat = Math.min(sw.lat, lat); sw.lng = Math.min(sw.lng, lng);
          ne.lat = Math.max(ne.lat, lat); ne.lng = Math.max(ne.lng, lng);
        }
      });
      if (sw === null) return;
      // 모든 마커가 동일 위치면 약간의 오프셋을 주어 setBounds 가 동작하게 함
      if (sw.lat === ne.lat && sw.lng === ne.lng) {
        var d = 0.005;
        sw.lat -= d; sw.lng -= d;
        ne.lat += d; ne.lng += d;
      }
      var bounds = new kakao.maps.LatLngBounds(
        new kakao.maps.LatLng(sw.lat, sw.lng),
        new kakao.maps.LatLng(ne.lat, ne.lng)
      );
      // 4방향 패딩 → 마커들이 가장자리에 붙지 않게 + 자동으로 적절한 줌 레벨 계산
      // setBounds 가 마커 분포에 따라 flexible 하게 zoom level 결정
      window._kakaoMap.setBounds(bounds, 90, 90, 90, 90);
      // 모두 같은 위치 등으로 너무 확대된 경우만 안전 보정
      setTimeout(function () {
        if (window._kakaoMap && window._kakaoMap.getLevel() < 4) {
          window._kakaoMap.setLevel(4);
        }
      }, 300);
      console.log('[KakaoMap] fitBounds SW:', sw, 'NE:', ne, 'level:', window._kakaoMap.getLevel());
    }

    function flutterPanMap(dx, dy) {
      if (!window._kakaoMap) return;
      window._kakaoMap.panBy(dx, dy);
    }

    // 지도 div 크기/위치를 실제 보이는 영역에만 맞춤 (화면별로 다름)
    function flutterSetMapBounds(top, left, width, height) {
      var div = document.getElementById('_flutter_kakao_map');
      if (!div) return;
      div.style.top = top + 'px';
      div.style.left = left + 'px';
      div.style.width = width + 'px';
      div.style.height = height + 'px';
      if (window._kakaoMap) {
        setTimeout(function () { window._kakaoMap.relayout(); }, 80);
      }
      console.log('[KakaoMap] 뷰포트 변경:', top, left, width, height);
    }

    // 실시간 위치 공유 오버레이 (파란 점)
    window._liveLocationOverlays = [];
    function flutterSetLiveLocations(locationsJson) {
      if (window._myLocationOverlay) {
        window._myLocationOverlay.setMap(null);
        window._myLocationOverlay = null;
      }
      (window._liveLocationOverlays || []).forEach(function (o) { o.setMap(null); });
      window._liveLocationOverlays = [];
      if (!window._kakaoMap) return;
      var locations = JSON.parse(locationsJson);
      locations.forEach(function (loc) {
        var pos = new kakao.maps.LatLng(loc.lat, loc.lng);
        var first = loc.name ? loc.name.charAt(0) : '?';
        var content =
          '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">' +
          '<div style="background:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;' +
          'color:#1B8A4F;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,0.25);">' + loc.name + '</div>' +
          '<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">' +
          '<path d="M14 2C8.477 2 4 6.477 4 12C4 19 14 34 14 34S24 19 24 12C24 6.477 19.523 2 14 2Z" fill="#26DE81"/>' +
          '<circle cx="14" cy="12" r="5" fill="white" opacity="0.9"/>' +
          '</svg>' +
          '</div>';
        var overlay = new kakao.maps.CustomOverlay({
          position: pos, content: content, yAnchor: 0.5, xAnchor: 0.5,
          map: window._kakaoMap, zIndex: 200
        });
        window._liveLocationOverlays.push(overlay);
      });
    }

    function flutterZoomIn() {
      if (!window._kakaoMap) return;
      var lv = window._kakaoMap.getLevel();
      if (lv > 1) window._kakaoMap.setLevel(lv - 1, { animate: true });
    }

    function flutterZoomOut() {
      if (!window._kakaoMap) return;
      var lv = window._kakaoMap.getLevel();
      if (lv < 14) window._kakaoMap.setLevel(lv + 1, { animate: true });
    }

    // 휠/핀치 delta 누적 → 임계치마다 한 단계씩 줌. 매 이벤트마다 점프하지 않고 부드럽게 전환.
    window._zoomAccum = 0;
    function flutterZoomBy(delta) {
      if (!window._kakaoMap) return;
      window._zoomAccum += delta;
      var threshold = 60; // 임계치(누적 px)
      while (window._zoomAccum >= threshold) {
        window._zoomAccum -= threshold;
        flutterZoomOut();
      }
      while (window._zoomAccum <= -threshold) {
        window._zoomAccum += threshold;
        flutterZoomIn();
      }
    }

    // 내 현재 위치 표시 (파동 애니메이션)
    window._myLocationOverlay = null;
    window._pendingMyLocation = null;
    function flutterUpdateMyLocation(lat, lng) {
      console.log('[MyLocation] called lat:', lat, 'lng:', lng, 'mapReady:', !!window._kakaoMap);
      if (!window._kakaoMap) {
        // 지도가 아직 준비 안 됐으면 준비 후 재시도
        window._pendingMyLocation = [lat, lng];
        var retry = setInterval(function () {
          if (window._kakaoMap && window._pendingMyLocation) {
            var p = window._pendingMyLocation;
            window._pendingMyLocation = null;
            clearInterval(retry);
            flutterUpdateMyLocation(p[0], p[1]);
          }
        }, 150);
        return;
      }
      if (window._myLocationOverlay) {
        window._myLocationOverlay.setMap(null);
        window._myLocationOverlay = null;
      }
      var pos = new kakao.maps.LatLng(lat, lng);
      var content =
        '<div style="position:relative;width:36px;height:36px;">' +
        '<div style="position:absolute;top:0;left:0;width:36px;height:36px;border-radius:50%;' +
        'background:rgba(76,175,80,0.3);animation:myLocationPulse 2s ease-out infinite;"></div>' +
        '<div style="position:absolute;top:10px;left:10px;width:16px;height:16px;border-radius:50%;' +
        'background:#4CAF50;border:2.5px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.25);"></div>' +
        '</div>';
      window._myLocationOverlay = new kakao.maps.CustomOverlay({
        position: pos,
        content: content,
        yAnchor: 0.5,
        xAnchor: 0.5,
        map: window._kakaoMap,
        zIndex: 300
      });
      console.log('[MyLocation] overlay created');
    }
  </script>

  <style>
    @keyframes myLocationPulse {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }

      70% {
        transform: scale(1.9);
        opacity: 0;
      }

      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    .my-location-pulse {
      animation: myLocationPulse 2s ease-out infinite;
    }

    html,
    body {
      background: transparent !important;
      margin: 0;
      padding: 0;
    }

    flt-glass-pane {
      background: transparent !important;
    }

    #kakao-map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
